<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subdiv - 3D Mesh Processing</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a1a;
      color: #eee;
    }
    #viewport {
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 240px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      user-select: none;
    }
    h1 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #aaa;
      margin-bottom: 4px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-group label {
      font-size: 12px;
      color: #bbb;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    select, input[type="file"], button {
      background: #2a2a2e;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    select:focus, button:focus {
      border-color: #3b82f6;
    }
    input[type="file"] {
      font-size: 11px;
    }
    #stats {
      font-size: 11px;
      color: #888;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <div id="ui-panel"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
